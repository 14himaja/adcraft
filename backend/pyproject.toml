[project]
name = "acm-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "pymongo>=4.13",
    "httpx",
    "argon2-cffi",
    "pyjwt",
    "cryptography",
    "structlog",
    "pillow>=12.3.0",
    "google-adk==2.11.0",
    "litellm",
    "facebook-business>=26,<27",
    "tenacity>=9.1.4",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "responses>=0.26.3",
    "respx>=0.23.1",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
